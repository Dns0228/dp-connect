name: DP Connect desktop build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to build
        required: true
        default: windows
        type: choice
        options: [windows, linux]

permissions:
  contents: read

env:
  QT_VERSION: 6.10.1
  QIF_VERSION: 4.7
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/

jobs:
  windows:
    if: inputs.target == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtremoteobjects qt5compat qtshadertools
          tools: tools_ifw
          dir: ${{ runner.temp }}
          aqtversion: ==3.3.0
          py7zrversion: ==0.22.*
          extra: --base ${{ env.QT_MIRROR }}

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install "conan==2.28.0"
          dotnet tool install --global wix --version 4.0.6
          wix extension add -g WixToolset.UI.wixext/4.0.6
          wix extension add -g WixToolset.Util.wixext/4.0.6
          "WIX_BIN_DIR=$env:USERPROFILE\.dotnet\tools" | Out-File $env:GITHUB_ENV -Append

      - name: Build DP Connect
        shell: cmd
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
          AMNEZIA_BUILD_TESTS: ON
        run: deploy\build.bat --installer all

      - name: Run DP Connect cryptographic tests
        shell: pwsh
        run: ctest --test-dir deploy/build -C Release --output-on-failure -R "BackupEncryptionTest|WireguardKeyGenerationTest"

      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Get-ChildItem deploy/build -File | Where-Object Extension -in '.exe','.msi' | ForEach-Object {
            $name = $_.Name -replace '^AmneziaVPN', 'DPConnect'
            Copy-Item $_.FullName (Join-Path artifacts $name)
          }
          if (-not (Get-ChildItem artifacts -File)) { throw 'No Windows installer was produced' }

      - uses: actions/upload-artifact@v4
        with:
          name: DPConnect-Windows
          path: artifacts/*
          if-no-files-found: error

  linux:
    if: inputs.target == 'linux'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtremoteobjects qt5compat qtshadertools
          tools: tools_ifw
          dir: ${{ runner.temp }}
          aqtversion: ==3.3.0
          py7zrversion: ==0.22.*
          extra: --base ${{ env.QT_MIRROR }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libsecret-1-dev ninja-build
          python -m pip install "conan==2.28.0"

      - name: Build DP Connect
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
          AMNEZIA_BUILD_TESTS: ON
        run: deploy/build.sh --generator Ninja --installer all

      - name: Run DP Connect cryptographic tests
        run: ctest --test-dir deploy/build -C Release --output-on-failure -R "BackupEncryptionTest|WireguardKeyGenerationTest"

      - name: Collect installer
        run: |
          mkdir -p artifacts
          find deploy/build -maxdepth 1 -type f -name '*.run' -exec cp {} artifacts/ \;
          for file in artifacts/AmneziaVPN*; do
            [ -e "$file" ] || continue
            mv "$file" "${file/AmneziaVPN/DPConnect}"
          done
          find artifacts -type f | grep -q .

      - uses: actions/upload-artifact@v4
        with:
          name: DPConnect-Linux
          path: artifacts/*
          if-no-files-found: error
